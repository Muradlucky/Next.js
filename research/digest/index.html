<title>Утренняя сводка</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: morning paper — masthead, 30-second digest, market strip, then sections from the world down to Thailand; reference rail on the right on wide screens. */
:root {
  --bg: #F3F5F4;
  --surface: #FFFFFF;
  --ink: #141A1F;
  --muted: #5A6570;
  --line: #DCE2E0;
  --accent: #0B7A63;
  --accent-soft: #E1F1EC;
  --up: #157A3D;
  --down: #B3261E;
  --warn: #A86500;
  --warn-soft: #FBF0DC;
  --claim: #A3194B;
  --claim-soft: #F9E4EB;
  --ru: #B3261E;
  --ua: #1F5FBF;
  --ind: #0B7A63;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
  --body: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1314; --surface: #151C1E; --ink: #E7ECEA; --muted: #9AA7A3; --line: #27322F;
    --accent: #3CC7A4; --accent-soft: #133029; --up: #5BD48A; --down: #FF8A80;
    --warn: #F2B65A; --warn-soft: #33270F; --claim: #FF8FB1; --claim-soft: #3A1622;
    --ru: #FF8A80; --ua: #7EB0FF; --ind: #3CC7A4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1314; --surface: #151C1E; --ink: #E7ECEA; --muted: #9AA7A3; --line: #27322F;
  --accent: #3CC7A4; --accent-soft: #133029; --up: #5BD48A; --down: #FF8A80;
  --warn: #F2B65A; --warn-soft: #33270F; --claim: #FF8FB1; --claim-soft: #3A1622;
  --ru: #FF8A80; --ua: #7EB0FF; --ind: #3CC7A4; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* Masthead */
.mast { display: grid; gap: 14px; padding-bottom: 22px; border-bottom: 2px solid var(--ink); }
.mast-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.mast h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5.4vw, 54px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mast h1 span { color: var(--accent); }
.lead { font-size: clamp(17px, 2vw, 20px); max-width: 62ch; margin: 0; font-weight: 500; }
.archive { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.archive select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); }
.legend .chip { white-space: normal; }

/* Status chips */
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-ok { color: var(--accent); background: var(--accent-soft); }
.st-single, .st-partial { color: var(--warn); background: var(--warn-soft); }
.st-unclear { color: var(--warn); border-color: var(--warn); }
.st-claim { color: var(--claim); background: var(--claim-soft); }
.st-skip { color: var(--muted); border-color: var(--line); }

/* 30 seconds */
.brief { margin-top: 26px; display: grid; gap: 4px; }
.brief h2, .sec-head h2, .rail h3 { margin: 0; }
.brief h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.brief ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.brief li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: baseline; }
.brief .tag { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }

/* Jump nav */
.jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 26px 0 8px; }
.jump button { font: 600 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.jump button:hover { border-color: var(--accent); color: var(--accent); }

/* Markets */
.markets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 18px; }
.tile { background: var(--surface); padding: 12px 14px 10px; display: grid; gap: 2px; min-width: 0; }
.tile .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
.tile .val { font-family: var(--mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .chg { font-family: var(--mono); font-size: 12px; display: flex; gap: 10px; color: var(--muted); }
.tile svg { width: 100%; height: 34px; display: block; margin-top: 4px; }
.pos { color: var(--up); } .neg { color: var(--down); } .neu { color: var(--ink); }
.src-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Main grid */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; margin-top: 34px; align-items: start; }
.sec { scroll-margin-top: 16px; padding-top: 6px; }
.sec + .sec { margin-top: 40px; }
.sec-head { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.sec-head h2 { font-family: var(--display); font-weight: 500; font-size: 24px; letter-spacing: -.01em; }
.sec-head p { margin: 0; color: var(--muted); font-size: 14px; }

.item { display: grid; gap: 10px; padding: 16px 0 20px; }
.item + .item { border-top: 1px dashed var(--line); }
.item-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item h3 { margin: 0; font-size: 19px; line-height: 1.3; text-wrap: balance; font-weight: 700; flex-basis: 100%; }
.kind { font-size: 12px; color: var(--muted); }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; }
.row b.k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 4px; font-weight: 700; }
.row p { margin: 0; max-width: 68ch; }
.row.impact p { font-weight: 500; }
.sides { display: grid; gap: 8px; }
.side { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; }
.side b { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.side.ru { border-color: var(--ru); } .side.ru b { color: var(--ru); }
.side.ua { border-color: var(--ua); } .side.ua b { color: var(--ua); }
.side.ind { border-color: var(--ind); } .side.ind b { color: var(--ind); }
.bul { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 70ch; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.srcs span { color: var(--muted); }

/* Charts */
.figure { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px 12px; margin-bottom: 18px; }
.figure h4 { margin: 0 0 10px; font-size: 14px; }
.figure svg { display: block; width: 100%; height: auto; }
.fig-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
.drivers { display: grid; gap: 10px; font-size: 14px; }
.drivers h5 { margin: 0 0 4px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.drivers ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.verdict { margin: 12px 0 0; font-size: 14px; color: var(--muted); max-width: 72ch; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.r, th.r { text-align: right; }

/* Rail */
.rail { display: grid; gap: 22px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px; font-size: 14px; }
.box h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.box ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.story b { display: block; }
.story small { color: var(--muted); display: block; }
.watch li { display: grid; grid-template-columns: 70px 1fr; gap: 8px; }
.sig { display: grid; gap: 4px; }
.sig .note { color: var(--muted); font-size: 13px; }
.empty { padding: 40px 0; color: var(--muted); }

@media (max-width: 960px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; }
  .markets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fig-cols { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .brief li { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .row { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .row b.k { padding-top: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .sec, .tile { animation: rise .4s ease both; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div class="eyebrow" id="eyebrow">Бангкок · утренняя сводка</div>
      <label class="archive" for="issue-select">Выпуск
        <select id="issue-select"></select>
      </label>
    </div>
    <h1 id="headline">Загружаю выпуск…</h1>
    <p class="lead" id="lead"></p>
    <div class="legend">
      <span class="chip st-ok">Подтверждено: 2+ независимых</span>
      <span class="chip st-single">Один источник</span>
      <span class="chip st-unclear">Данные расходятся</span>
      <span class="chip st-claim">Заявления сторон</span>
    </div>
  </header>

  <section class="brief" aria-labelledby="brief-h">
    <h2 id="brief-h">За 30 секунд</h2>
    <ul id="top"></ul>
  </section>

  <nav class="jump" id="jump" aria-label="Разделы"></nav>

  <section aria-labelledby="mk-h">
    <h2 id="mk-h" class="eyebrow" style="margin:0">Рынки · 30 дней</h2>
    <div class="markets" id="markets"></div>
    <div class="src-note" id="mk-src"></div>
  </section>

  <div class="grid">
    <main id="sections"></main>
    <aside class="rail" id="rail"></aside>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const rich = (s) => esc(s).replace(/&lt;(\/?)b&gt;/g, "<$1b>");
  const STATUS = { ok: "Подтверждено", single: "Один источник", unclear: "Данные расходятся", claim: "Заявления сторон", partial: "Частично", skip: "Отфильтровано" };
  const PAIRS = new Set(["usdthb", "eurthb", "usdrub", "ust10"]);
  const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
  const fmt = (v, d) => Number(v).toLocaleString("ru-RU", { minimumFractionDigits: d, maximumFractionDigits: d });
  const pct = (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) + "%";
  const sign = (v, id) => (PAIRS.has(id) ? "neu" : v > 0 ? "pos" : v < 0 ? "neg" : "neu");
  const chip = (st) => `<span class="chip st-${esc(st)}">${esc(STATUS[st] || st)}</span>`;

  function spark(series, w, h, pad) {
    const ys = series.map((p) => p[1]);
    const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
    const x = (i) => pad + (i * (w - 2 * pad)) / (series.length - 1);
    const y = (v) => pad + (h - 2 * pad) * (1 - (v - min) / span);
    const line = series.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const area = `${line}L${x(series.length - 1).toFixed(1)},${h}L${x(0).toFixed(1)},${h}Z`;
    return { line, area, x, y, min, max, last: series[series.length - 1] };
  }

  function tile(m) {
    const s = spark(m.series, 160, 34, 2);
    return `<div class="tile">
      <div class="lbl">${esc(m.label)}</div>
      <div class="val">${m.unit === "$" ? "$" : ""}${fmt(m.value, m.decimals)}${m.unit && m.unit !== "$" ? " " + esc(m.unit) : ""}</div>
      <div class="chg"><span class="${sign(m.change_1d_pct, m.id)}">${pct(m.change_1d_pct)} день</span><span class="${sign(m.change_30d_pct, m.id)}">${pct(m.change_30d_pct)} 30 д</span></div>
      <svg viewBox="0 0 160 34" preserveAspectRatio="none" aria-hidden="true">
        <path d="${s.area}" fill="var(--accent-soft)"></path>
        <path d="${s.line}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"></path>
      </svg>
    </div>`;
  }

  function thbChart(m) {
    const W = 520, H = 190, L = 44, R = 64, T = 14, B = 26;
    const ys = m.series.map((p) => p[1]);
    const min = Math.min(...ys), max = Math.max(...ys), span = max - min || 1;
    const x = (i) => L + (i * (W - L - R)) / (m.series.length - 1);
    const y = (v) => T + (H - T - B) * (1 - (v - min) / span);
    const line = m.series.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`).join("");
    const last = m.series[m.series.length - 1], first = m.series[0];
    const grid = [min, (min + max) / 2, max].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"></line><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${fmt(v, 2)}</text>`).join("");
    const d = (s) => s.slice(8, 10) + "." + s.slice(5, 7);
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Курс USD/THB за 30 дней: от ${fmt(first[1], 2)} до ${fmt(last[1], 2)}">
      ${grid}
      <path d="${line}L${x(m.series.length - 1)},${H - B}L${L},${H - B}Z" fill="var(--accent-soft)"></path>
      <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"></path>
      <circle cx="${x(m.series.length - 1)}" cy="${y(last[1])}" r="4" fill="var(--accent)"></circle>
      <text x="${x(m.series.length - 1) + 8}" y="${y(last[1]) + 4}" font-size="13" font-weight="600" fill="var(--ink)" font-family="var(--mono)">${fmt(last[1], 2)}</text>
      <text x="${L}" y="${H - 6}" font-size="11" fill="var(--muted)">${d(first[0])}</text>
      <text x="${W - R}" y="${H - 6}" font-size="11" fill="var(--muted)" text-anchor="end">${d(last[0])}</text>
    </svg>`;
  }

  function fxBars(fx) {
    const rows = [...fx].sort((a, b) => b.change_30d_pct - a.change_30d_pct);
    const lim = Math.max(1, ...rows.map((r) => Math.abs(r.change_30d_pct)));
    const W = 520, rowH = 26, L = 150, R = 56, mid = L + (W - L - R) / 2, half = (W - L - R) / 2;
    const H = rows.length * rowH + 10;
    const bars = rows.map((r, i) => {
      const v = r.change_30d_pct, w = (Math.abs(v) / lim) * half, yy = i * rowH + 6;
      const hl = r.code === "THB";
      const fill = v >= 0 ? "var(--up)" : "var(--down)";
      return `<text x="${L - 8}" y="${yy + 14}" text-anchor="end" font-size="12" fill="var(--ink)" font-weight="${hl ? 700 : 400}">${esc(r.name)} · ${esc(r.code)}</text>
        <rect x="${v >= 0 ? mid : mid - w}" y="${yy + 3}" width="${Math.max(w, 1)}" height="14" rx="2" fill="${fill}" opacity="${hl ? 1 : 0.7}"></rect>
        <text x="${W - 4}" y="${yy + 14}" text-anchor="end" font-size="12" fill="var(--ink)" font-family="var(--mono)" font-weight="${hl ? 700 : 400}">${pct(v)}</text>`;
    }).join("");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Изменение валют Азии к доллару за 30 дней">
      <line x1="${mid}" x2="${mid}" y1="0" y2="${H}" stroke="var(--muted)" stroke-width="1"></line>${bars}</svg>`;
  }

  function item(it) {
    const rows = [];
    if (it.fact) rows.push(`<div class="row"><b class="k">Факт</b><p>${esc(it.fact)}</p></div>`);
    if (it.sides) rows.push(`<div class="sides">${it.sides.map((s) => `<div class="side ${esc(s.side)}"><b>${esc(s.who)}</b>${esc(s.text)}</div>`).join("")}</div>`);
    if (it.bullets) rows.push(`<ul class="bul">${it.bullets.map((b) => `<li>${rich(b)}</li>`).join("")}</ul>`);
    if (it.context) rows.push(`<div class="row"><b class="k">Контекст</b><p>${esc(it.context)}</p></div>`);
    if (it.impact) rows.push(`<div class="row impact"><b class="k">Для нас</b><p>${esc(it.impact)}</p></div>`);
    const srcs = (it.sources || []).map((s) => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("");
    return `<article class="item">
      <div class="item-top">${chip(it.status)}<span class="kind">${esc(it.kind || "")}</span><h3>${esc(it.title)}</h3></div>
      <div class="rows">${rows.join("")}</div>
      ${srcs ? `<div class="srcs"><span>Источники:</span>${srcs}</div>` : ""}
    </article>`;
  }

  function chartFor(sec, d) {
    if (sec.chart === "thb") {
      const m = (d.markets || []).find((x) => x.id === "usdthb");
      if (!m) return "";
      const t = sec.thb || {};
      return `<div class="figure">
        <h4>${esc(t.headline || "USD/THB за 30 дней")} <span class="kind">· сколько бат за доллар, выше = бат слабее</span></h4>
        <div class="fig-cols">
          <div>${thbChart(m)}</div>
          <div class="drivers">
            <div><h5 class="neg">Давит на бат</h5><ul>${(t.down || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
            <div><h5 class="pos">Поддерживает</h5><ul>${(t.up || []).map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
          </div>
        </div>
        ${t.verdict ? `<p class="verdict">${esc(t.verdict)}</p>` : ""}
      </div>`;
    }
    if (sec.chart === "asia") {
      const fx = d.fx || [], ix = d.asia_indices || [];
      const per = d.fx_period ? `${d.fx_period[0].slice(8)}.${d.fx_period[0].slice(5, 7)}–${d.fx_period[1].slice(8)}.${d.fx_period[1].slice(5, 7)}` : "30 дней";
      return `<div class="figure">
        <h4>Валюты к доллару за ${esc(per)} <span class="kind">· плюс = валюта укрепилась · ${esc(d.fx_source?.name || "")}</span></h4>
        ${fx.length ? fxBars(fx) : "<p class='kind'>Нет данных</p>"}
      </div>
      ${ix.length ? `<div class="figure"><h4>Фондовые индексы Азии</h4><div class="tbl-wrap"><table>
        <thead><tr><th>Индекс</th><th>Страна</th><th class="r">Значение</th><th class="r">День</th><th class="r">30 дней</th></tr></thead>
        <tbody>${ix.map((a) => `<tr><td>${esc(a.label)}</td><td>${esc(a.country)}</td><td class="r num">${fmt(a.value, 0)}</td><td class="r num ${sign(a.change_1d_pct)}">${pct(a.change_1d_pct)}</td><td class="r num ${sign(a.change_30d_pct)}">${pct(a.change_30d_pct)}</td></tr>`).join("")}</tbody>
      </table></div><div class="src-note">Yahoo Finance, закрытие ${esc(ix[0].date)}</div></div>` : ""}`;
    }
    if (sec.chart === "rub") {
      const m = (d.markets || []).find((x) => x.id === "usdrub"), c = d.cbr_usd;
      if (!m && !c) return "";
      return `<div class="figure"><h4>Доллар в рублях: два источника</h4><div class="tbl-wrap"><table>
        <tbody>${c ? `<tr><td>Официальный курс Банка России</td><td class="r num">${fmt(c.value, 2)} ₽</td><td class="kind">на ${esc(c.date)}</td></tr>` : ""}
        ${m ? `<tr><td>Рыночный (Yahoo Finance)</td><td class="r num">${fmt(m.value, 2)} ₽</td><td class="kind">${pct(m.change_30d_pct)} за 30 дней</td></tr>` : ""}</tbody>
      </table></div></div>`;
    }
    return "";
  }

  function render(d, issues) {
    const [yy, mm, dd] = d.date.split("-");
    document.title = `Утренняя сводка · ${dd}.${mm}`;
    $("eyebrow").textContent = `Бангкок · ${d.edition || "выпуск"} · обновлено ${d.updated || ""}`;
    $("headline").innerHTML = `${Number(dd)} ${MONTHS[Number(mm) - 1]}, <span>${esc(d.weekday)}</span>`;
    $("lead").textContent = d.lead || "";
    $("top").innerHTML = (d.top || []).map((t) => `<li><span class="tag">${esc(t.tag)}</span><span>${esc(t.text)}</span></li>`).join("");
    $("markets").innerHTML = (d.markets || []).map(tile).join("");
    $("mk-src").textContent = `Источник котировок: Yahoo Finance, данные на ${d.data_generated_utc || ""} UTC. Валюты Азии — официальные курсы ЕЦБ.` + ((d.data_errors || []).length ? ` Не загрузилось: ${d.data_errors.join("; ")}.` : "");

    const secs = d.sections || [];
    $("jump").innerHTML = secs.map((s) => `<button type="button" data-target="sec-${esc(s.id)}">${esc(s.title)}</button>`).join("") + `<button type="button" data-target="rail">Сюжеты и проверка</button>`;
    $("sections").innerHTML = secs.map((s) => `<section class="sec" id="sec-${esc(s.id)}">
      <div class="sec-head"><h2>${esc(s.title)}</h2>${s.kicker ? `<p>${esc(s.kicker)}</p>` : ""}</div>
      ${chartFor(s, d)}
      ${(s.items || []).map(item).join("")}
    </section>`).join("");

    const tg = d.telegram;
    $("rail").innerHTML = `
      ${(d.stories || []).length ? `<div class="box"><h3>Сюжеты на контроле</h3><ul>${d.stories.map((s) => `<li class="story"><b>${esc(s.name)}</b><small>с ${esc(s.since)}</small>${esc(s.now)}<small>Дальше: ${esc(s.next)}</small></li>`).join("")}</ul></div>` : ""}
      ${(d.watch || []).length ? `<div class="box"><h3>Ждём</h3><ul class="watch">${d.watch.map((w) => `<li><span class="num">${esc(w.date)}</span><span>${esc(w.event)}</span></li>`).join("")}</ul></div>` : ""}
      ${tg ? `<div class="box"><h3>Telegram: проверка сигналов</h3><div class="kind">${esc(tg.channel)} — ${esc(tg.note)}</div><ul>${tg.signals.map((s) => `<li class="sig">${chip(s.verdict)}<span>${esc(s.text)}</span><span class="note">${esc(s.note)}</span></li>`).join("")}</ul></div>` : ""}
      ${(d.filtered || []).length ? `<div class="box"><h3>Отфильтровано как шум</h3><ul>${d.filtered.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}
      ${(d.unverified || []).length ? `<div class="box"><h3>Не удалось проверить</h3><ul>${d.unverified.map((f) => `<li>${esc(f)}</li>`).join("")}</ul></div>` : ""}`;
    $("rail").id = "rail";

    const sel = $("issue-select");
    sel.innerHTML = issues.map((i) => `<option value="${esc(i.date)}">${esc(i.date.slice(8))}.${esc(i.date.slice(5, 7))} · ${esc(i.weekday || "")}</option>`).join("");
    sel.value = d.date;
  }

  let ISSUES = [];
  async function load(date) {
    try {
      const r = await fetch(`data/${date}.json`, { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      render(await r.json(), ISSUES);
    } catch (e) {
      $("headline").textContent = "Выпуск не загрузился";
      $("lead").textContent = `Файл data/${date}.json недоступен (${e.message}). Выберите другой выпуск в списке.`;
    }
  }
  function current() {
    const h = location.hash.replace("#", "");
    return ISSUES.some((i) => i.date === h) ? h : (ISSUES[0] || {}).date;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-target]");
    if (b) document.getElementById(b.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" });
  });
  $("issue-select").addEventListener("change", (e) => { location.hash = e.target.value; });
  window.addEventListener("hashchange", () => load(current()));
  fetch("data/issues.json", { cache: "no-store" })
    .then((r) => r.json())
    .then((j) => { ISSUES = (j.issues || []).sort((a, b) => b.date.localeCompare(a.date)); return load(current()); })
    .catch(() => { $("headline").textContent = "Архив не загрузился"; });
})();
</script>
